name: Build PROTOCOL SAKHA APK and EXE

on:
  workflow_dispatch

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor Project
        run: |
          mkdir cap
          cp -r www assets cap/
          mkdir -p cap/www/assets
          cp assets/NotoSansGujarati-Regular.ttf assets/NotoSansGujarati-Bold.ttf cap/www/assets/
          sed -i 's#../assets/NotoSansGujarati-#assets/NotoSansGujarati-#g' cap/www/index.html
          cp native-shim.js cap/www/native-shim.js
          cp native-plugins-entry.js cap/
          cp capacitor.config.json protocol-sakha.keystore patch_gradle.py cap/
          mkdir -p cap/www/lib
          cd cap
          grep -q 'lib/native-plugins.js' www/index.html || sed -i 's#</head>#<script src="capacitor.js"></script><script src="lib/native-plugins.js"></script><script src="native-shim.js"></script></head>#' www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npm install html2canvas@1.4.1 jspdf@2.5.1 esbuild
          npx esbuild native-plugins-entry.js --bundle --platform=browser --format=iife --outfile=www/lib/native-plugins.js
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/html2canvas.min.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/jspdf.umd.min.js
          npm install -D @capacitor/assets@3
          npx cap add android
          npx capacitor-assets generate --android
          python3 patch_gradle.py
          npx cap sync android

      - name: Build APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        run: cp cap/android/app/build/outputs/apk/release/app-release.apk PROTOCOL-SAKHA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-apk
          path: PROTOCOL-SAKHA.apk

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build EXE
        run: npx electron-builder --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-exe
          path: dist/PROTOCOL-SAKHA.exe
