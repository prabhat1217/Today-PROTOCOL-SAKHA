name: Build PROTOCOL SAKHA APK and EXE

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          mkdir -p cap/www/lib cap/www/assets
          cp index.html cap/www/index.html
          cp main.js native-shim.js cap/www/
          cp NotoSansGujarati-Regular.ttf NotoSansGujarati-Bold.ttf cap/www/assets/
          cp icon.png icon-background.png icon-foreground.png icon-only.png cap/
          cp capacitor.config.json patch_gradle.py protocol-sakha.keystore cap/
          cp native-plugins-entry.js cap/
          cd cap
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npm install html2canvas@1.4.1 jspdf@2.5.1 esbuild
          npx esbuild native-plugins-entry.js --bundle --platform=browser --format=iife --outfile=www/lib/native-plugins.js
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/html2canvas.min.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/jspdf.umd.min.js
          npm install -D @capacitor/assets@3
          npx cap add android
          npx capacitor-assets generate --android
          python3 patch_gradle.py
          npx cap sync android

      - name: Build APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-apk
          path: cap/android/app/build/outputs/apk/release/app-release.apk

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build EXE
        run: npx electron-builder --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-exe
          path: dist/*.exe
